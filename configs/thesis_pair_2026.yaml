# Two-repository protocol for the held-out thesis evaluation (kickoff decision D2).
#
# Pair rationale: django/django and gradle/gradle contrast on language, build tool
# and log convention (Python with pytest/flake8 against JVM with Gradle), while
# staying within one order of magnitude on log size. That second criterion is a
# feasibility one, and it matters: above roughly 3,000 lines the log filter
# saturates its token budget, so the model receives a fixed-size window and the
# measurement drifts towards testing the filter rather than the model. Measured
# medians from the six-repository run, with the share of each log the model
# actually receives after filtering:
#
#   django/django     256 lines   model sees 22.7%
#   gradle/gradle   2,526 lines   model sees 10.0%
#   facebook/react 48,815 lines   model sees  0.6%   <- previously paired, dropped
#
# Repositories were selected on log tractability and ecosystem contrast, never on
# model performance. Confirm the pair against the historical failure-to-fix
# feasibility check before freezing it.
#
# Target arithmetic, derived from the repository assessment of 28 September and
# 10 October 2026 (30 runs inspected per repository, recorded under
# tools/check_repository_gate.py):
#
#   gradle/gradle   30 inspected -> 14 in scope -> 11 distinct failure families
#   django/django   30 inspected -> 15 in scope ->  3 distinct failure families
#
# A combined yield of roughly 0.23 usable cases per inspected run. GitHub's
# workflow-runs listing returns at most 100 entries per request, so one
# collection pass over two repositories can inspect at most 200 runs and should
# be expected to produce in the region of 45 usable cases.
#
# That is enough for the 15 development and 15 pilot cases with margin, and not
# enough for the 50 held-out cases in a single pass. Held-out collection is
# therefore expected to need a second pass over a later window, which is
# consistent with the plan treating 120 as a target rather than a quota.
#
# The eligible range below is deliberately wide: a count far above or below it
# means the yield assumption no longer holds and should be re-examined rather
# than absorbed silently.
study_id: thesis_pair_2026
title: Two-repository contrasting GitHub Actions failure dataset (Python and JVM)
source: github_actions
unit_of_analysis: failed_workflow_run
sampling_method: latest_failed_runs_per_repository
auto_discovery: false
target_raw_logs: 200
target_eligible_logs:
  minimum: 25
  maximum: 200

repositories:
  - name: django/django
    max_logs: 100
    ecosystem: python
  - name: gradle/gradle
    max_logs: 100
    ecosystem: jvm

eligibility:
  required_conclusion: failure
  minimum_log_lines: 20
  maximum_duplicate_error_signatures_per_repository: 2
  require_downloadable_log: true

exclusions:
  - cancelled_run
  - token_error
  - too_short
  - duplicate_error
  - unavailable_log
  - used_in_exploratory_cohort

research_controls:
  use_fixed_repository_list: true
  preserve_raw_logs: true
  blind_annotation: true
  do_not_tune_on_final_dataset: true
