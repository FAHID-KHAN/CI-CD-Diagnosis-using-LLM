api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  
llm:
  default_provider: "openai"
  default_model: "gpt-5.6-terra"
  # Both thesis models use the same controlled reasoning level.
  reasoning_effort: "medium"
  # Used only by non-reasoning/legacy providers.
  temperature: 0.0
  max_tokens: 4096
  
filtering:
  enabled: true
  max_context_lines: 500
  window_size: 10
  
grounding:
  enabled: true
  threshold: 0.8
