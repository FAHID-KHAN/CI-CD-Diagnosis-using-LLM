[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cicd-diagnosis"
version = "1.0.0"
description = "Automated CI/CD failure diagnosis using LLMs"
authors = [{name = "Fahid Khan", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.5.0",
    "openai>=2.15.0",
    "requests>=2.31.0",
    "scipy>=1.11.4",
    "matplotlib>=3.8.2",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.2",
    "pyyaml>=6.0.1",
    "tiktoken>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
