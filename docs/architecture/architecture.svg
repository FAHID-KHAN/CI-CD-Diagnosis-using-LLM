<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1220" viewBox="0 0 2400 1220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56627a"/></marker></defs><rect width="2400" height="1220" fill="#ffffff"/><text x="60" y="66" font-size="38" font-weight="750" fill="#16233d">CI/CD Failure Diagnosis — Artifact and Evaluation Apparatus</text><text x="60" y="98" font-size="16" fill="#5a6678">The model is one replaceable component inside a fixed apparatus. Only the model varies between the two conditions.</text><text x="60" y="150" font-size="23" font-weight="700" fill="#16233d">A.  The diagnostic artifact</text><text x="60" y="176" font-size="14.5" fill="#5a6678">This is what the thesis evaluates.</text><rect x="60" y="204" width="268" height="92" rx="11" fill="#e4ecf9" stroke="#5b7ba8" stroke-width="2"/><text x="194.0" y="246.5" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Raw failure log</text><text x="194.0" y="265.5" text-anchor="middle" font-size="12.5" fill="#5a6678">one failed workflow run</text><rect x="372" y="204" width="268" height="92" rx="11" fill="#e2f0e8" stroke="#5f9b7c" stroke-width="2"/><text x="506.0" y="238.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">LogFilter</text><text x="506.0" y="257.0" text-anchor="middle" font-size="12.5" fill="#5a6678">error keywords, ±20 lines</text><text x="506.0" y="273.0" text-anchor="middle" font-size="12.5" fill="#5a6678">[Line N] numbers preserved</text><rect x="684" y="204" width="268" height="92" rx="11" fill="#e2f0e8" stroke="#5f9b7c" stroke-width="2"/><text x="818.0" y="238.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Shared prompt</text><text x="818.0" y="257.0" text-anchor="middle" font-size="12.5" fill="#5a6678">strict JSON schema,</text><text x="818.0" y="273.0" text-anchor="middle" font-size="12.5" fill="#5a6678">8 fixed categories</text><path d="M 334 250.0 L 364 250.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 646 250.0 L 676 250.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><rect x="996" y="152.0" width="268" height="72" rx="11" fill="#ece3f6" stroke="#8a6fb2" stroke-width="2"/><text x="1130.0" y="184.5" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Proprietary</text><text x="1130.0" y="203.5" text-anchor="middle" font-size="12.5" fill="#5a6678">openai/gpt-5.6-terra</text><rect x="996" y="276.0" width="268" height="72" rx="11" fill="#ece3f6" stroke="#8a6fb2" stroke-width="2"/><text x="1130.0" y="308.5" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Open-weights</text><text x="1130.0" y="327.5" text-anchor="middle" font-size="12.5" fill="#5a6678">local/thesis-qwen3.5:9b-24k</text><path d="M 958 250.0 H 973.0 V 188.0 H 988" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 958 250.0 H 973.0 V 312.0 H 988" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><rect x="1308" y="204" width="268" height="92" rx="11" fill="#fdf1d8" stroke="#cfa44a" stroke-width="2"/><text x="1442.0" y="238.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Structured diagnosis</text><text x="1442.0" y="257.0" text-anchor="middle" font-size="12.5" fill="#5a6678">category, failure lines,</text><text x="1442.0" y="273.0" text-anchor="middle" font-size="12.5" fill="#5a6678">root cause, fix, evidence</text><rect x="1620" y="204" width="268" height="92" rx="11" fill="#e2f0e8" stroke="#5f9b7c" stroke-width="2"/><text x="1754.0" y="238.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Grounding check</text><text x="1754.0" y="257.0" text-anchor="middle" font-size="12.5" fill="#5a6678">do the cited lines</text><text x="1754.0" y="273.0" text-anchor="middle" font-size="12.5" fill="#5a6678">exist in the extract?</text><rect x="1932" y="204" width="268" height="92" rx="11" fill="#fdf1d8" stroke="#cfa44a" stroke-width="2"/><text x="2066.0" y="238.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Result + run metadata</text><text x="2066.0" y="257.0" text-anchor="middle" font-size="12.5" fill="#5a6678">tokens, cost, latency,</text><text x="2066.0" y="273.0" text-anchor="middle" font-size="12.5" fill="#5a6678">raw response</text><path d="M 1582 250.0 L 1612 250.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 1894 250.0 L 1924 250.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 1270 188.0 H 1285.0 V 250.0 H 1300" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 1270 312.0 H 1285.0 V 250.0 H 1300" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><text x="60" y="382.0" font-size="13.5" fill="#5a6678">Identical filtered text, prompt, response schema and reasoning effort for both conditions — so any measured difference is attributable to the model.</text><text x="60" y="438.0" font-size="23" font-weight="700" fill="#16233d">B.  Evaluation apparatus — constructing the evidence</text><text x="60" y="464.0" font-size="14.5" fill="#5a6678">Never sees model output, so the labels cannot be influenced by the predictions.</text><rect x="60" y="492.0" width="268" height="92" rx="11" fill="#e4ecf9" stroke="#5b7ba8" stroke-width="2"/><text x="194.0" y="534.5" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">GitHub Actions API</text><text x="194.0" y="553.5" text-anchor="middle" font-size="12.5" fill="#5a6678">failed runs only</text><rect x="372" y="492.0" width="268" height="92" rx="11" fill="#e2f0e8" stroke="#5f9b7c" stroke-width="2"/><text x="506.0" y="526.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Collect</text><text x="506.0" y="545.0" text-anchor="middle" font-size="12.5" fill="#5a6678">fixed repository list,</text><text x="506.0" y="561.0" text-anchor="middle" font-size="12.5" fill="#5a6678">no auto-discovery</text><rect x="684" y="492.0" width="268" height="92" rx="11" fill="#fdf1d8" stroke="#cfa44a" stroke-width="2"/><text x="818.0" y="534.5" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Immutable raw logs</text><text x="818.0" y="553.5" text-anchor="middle" font-size="12.5" fill="#5a6678">+ SHA-256 per log</text><rect x="996" y="492.0" width="268" height="92" rx="11" fill="#e2f0e8" stroke="#5f9b7c" stroke-width="2"/><text x="1130.0" y="526.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Triage</text><text x="1130.0" y="545.0" text-anchor="middle" font-size="12.5" fill="#5a6678">cancelled · auth · too short</text><text x="1130.0" y="561.0" text-anchor="middle" font-size="12.5" fill="#5a6678">· duplicate signature</text><rect x="1308" y="492.0" width="268" height="92" rx="11" fill="#fdf1d8" stroke="#cfa44a" stroke-width="2"/><text x="1442.0" y="534.5" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Eligible cohort</text><text x="1442.0" y="553.5" text-anchor="middle" font-size="12.5" fill="#5a6678">the frozen study set</text><path d="M 334 538.0 L 364 538.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 646 538.0 L 676 538.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 958 538.0 L 988 538.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 1270 538.0 L 1300 538.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 1130.0 590.0 V 630.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><rect x="996.0" y="638.0" width="268" height="72" rx="11" fill="#fdf1d8" stroke="#cfa44a" stroke-width="2"/><text x="1130.0" y="670.5" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Excluded cases</text><text x="1130.0" y="689.5" text-anchor="middle" font-size="12.5" fill="#5a6678">with a recorded reason</text><rect x="372" y="764.0" width="268" height="92" rx="11" fill="#e4ecf9" stroke="#5b7ba8" stroke-width="2"/><text x="506.0" y="798.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Blind annotation</text><text x="506.0" y="817.0" text-anchor="middle" font-size="12.5" fill="#5a6678">category · root cause · lines</text><text x="506.0" y="833.0" text-anchor="middle" font-size="12.5" fill="#5a6678">· linked evidence</text><rect x="684" y="764.0" width="268" height="92" rx="11" fill="#e4ecf9" stroke="#5b7ba8" stroke-width="2"/><text x="818.0" y="798.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Independent review</text><text x="818.0" y="817.0" text-anchor="middle" font-size="12.5" fill="#5a6678">a different reviewer,</text><text x="818.0" y="833.0" text-anchor="middle" font-size="12.5" fill="#5a6678">blind to the first</text><rect x="996" y="764.0" width="268" height="92" rx="11" fill="#fdf1d8" stroke="#cfa44a" stroke-width="2"/><text x="1130.0" y="798.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Adjudicated ground truth</text><text x="1130.0" y="817.0" text-anchor="middle" font-size="12.5" fill="#5a6678">written decision on</text><text x="1130.0" y="833.0" text-anchor="middle" font-size="12.5" fill="#5a6678">every disagreement</text><rect x="1308" y="764.0" width="268" height="92" rx="11" fill="#fbe2cd" stroke="#c2702a" stroke-width="2"/><text x="1442.0" y="798.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Audit gate</text><text x="1442.0" y="817.0" text-anchor="middle" font-size="12.5" fill="#5a6678">evidence, independence,</text><text x="1442.0" y="833.0" text-anchor="middle" font-size="12.5" fill="#5a6678">usable root cause</text><path d="M 646 810.0 L 676 810.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 958 810.0 L 988 810.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 1270 810.0 L 1300 810.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 1442.0 590.0 V 730.0 H 506.0 V 756.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><text x="60" y="936.0" font-size="23" font-weight="700" fill="#16233d">C.  Evaluation apparatus — measurement</text><text x="60" y="962.0" font-size="14.5" fill="#5a6678">Both conditions are scored on exactly the same cases against the same ground truth.</text><rect x="60" y="990.0" width="268" height="92" rx="11" fill="#fbe2cd" stroke="#c2702a" stroke-width="2"/><text x="194.0" y="1024.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Partition guard</text><text x="194.0" y="1043.0" text-anchor="middle" font-size="12.5" fill="#5a6678">refuses a held-out run over</text><text x="194.0" y="1059.0" text-anchor="middle" font-size="12.5" fill="#5a6678">any exploratory case</text><rect x="372" y="990.0" width="268" height="92" rx="11" fill="#e2f0e8" stroke="#5f9b7c" stroke-width="2"/><text x="506.0" y="1024.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Scoring</text><text x="506.0" y="1043.0" text-anchor="middle" font-size="12.5" fill="#5a6678">exact category match;</text><text x="506.0" y="1059.0" text-anchor="middle" font-size="12.5" fill="#5a6678">per-category P/R/F1; lines</text><rect x="684" y="990.0" width="268" height="92" rx="11" fill="#e2f0e8" stroke="#5f9b7c" stroke-width="2"/><text x="818.0" y="1024.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Paired statistics</text><text x="818.0" y="1043.0" text-anchor="middle" font-size="12.5" fill="#5a6678">McNemar · permutation</text><text x="818.0" y="1059.0" text-anchor="middle" font-size="12.5" fill="#5a6678">· bootstrap CI</text><rect x="996" y="990.0" width="268" height="92" rx="11" fill="#fae7e7" stroke="#c07a7a" stroke-width="2"/><text x="1130.0" y="1024.0" text-anchor="middle" font-size="15.5" font-weight="650" fill="#16233d">Comparison report</text><text x="1130.0" y="1043.0" text-anchor="middle" font-size="12.5" fill="#5a6678">terminal table +</text><text x="1130.0" y="1059.0" text-anchor="middle" font-size="12.5" fill="#5a6678">self-contained HTML page</text><path d="M 334 1036.0 L 364 1036.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 646 1036.0 L 676 1036.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><path d="M 958 1036.0 L 988 1036.0" stroke="#56627a" stroke-width="2.2" fill="none" marker-end="url(#tip)"/><text x="60" y="1144.0" font-size="14" font-weight="650" fill="#16233d">Legend</text><rect x="150" y="1131.0" width="17" height="17" rx="4" fill="#e4ecf9" stroke="#5b7ba8" stroke-width="2"/><text x="176" y="1144.0" font-size="13.5" fill="#5a6678">Source or human input</text><rect x="351.6" y="1131.0" width="17" height="17" rx="4" fill="#e2f0e8" stroke="#5f9b7c" stroke-width="2"/><text x="377.6" y="1144.0" font-size="13.5" fill="#5a6678">Deterministic process</text><rect x="553.2" y="1131.0" width="17" height="17" rx="4" fill="#ece3f6" stroke="#8a6fb2" stroke-width="2"/><text x="579.2" y="1144.0" font-size="13.5" fill="#5a6678">Model condition</text><rect x="709.2" y="1131.0" width="17" height="17" rx="4" fill="#fdf1d8" stroke="#cfa44a" stroke-width="2"/><text x="735.2" y="1144.0" font-size="13.5" fill="#5a6678">Stored research data</text><rect x="903.2" y="1131.0" width="17" height="17" rx="4" fill="#fae7e7" stroke="#c07a7a" stroke-width="2"/><text x="929.2" y="1144.0" font-size="13.5" fill="#5a6678">Evaluation output</text><rect x="1074.4" y="1131.0" width="17" height="17" rx="4" fill="#fbe2cd" stroke="#c2702a" stroke-width="2"/><text x="1100.4" y="1144.0" font-size="13.5" fill="#5a6678">Methodological gate</text><text x="60" y="1182.0" font-size="13.5" fill="#5a6678">Out of scope in the current system: rule-based or heuristic baselines, RAG comparison, human-versus-LLM study, and root-cause rubric scoring.</text></svg>